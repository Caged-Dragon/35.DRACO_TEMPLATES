<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#eee4d6"><meta name="description" content="Cut-paper layers, folded shapes, warm cardstock and gentle dimensional shadows."><title>Paper Craft · Caged Dragon Sign-in Template</title><link rel="stylesheet" href="./styles.css"><script src="./script.js" defer></script></head>
<body class="no-brand"><main class="scene"><div class="auth-shell"><section class="visual-panel reveal"><div><div class="eyebrow">17 · TACTILE</div><h2 class="visual-title">A little space to settle in.</h2><p class="visual-copy">Familiar, friendly and ready when you are.</p></div><div class="art" aria-hidden="true"></div><div class="micro"><strong>ONE ACCOUNT.</strong> MANY POSSIBILITIES.</div></section><section class="form-panel reveal-delay"><div class="form-card"><div class="eyebrow">YOUR PERSONAL SPACE</div><h1>It’s good to have you back</h1><p class="form-sub">Enter your details to continue.</p><form id="authForm" novalidate><label class="field" for="identifier">Email address or mobile number<input id="identifier" name="identifier" type="text" placeholder="name@example.com or +91 98765 43210" autocomplete="username" inputmode="email" required></label><label class="field" for="password">Password<span class="password-wrap"><input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required minlength="8"><button class="toggle-password" type="button" aria-label="Show password" aria-pressed="false">SHOW</button></span></label><div class="form-options"><label class="remember"><input type="checkbox" name="remember"> <span>Remember me</span></label><a class="form-link" href="#forgot" id="forgotLink">Forgot password?</a></div><button class="submit" type="submit">Sign in <span aria-hidden="true">→</span></button><p class="status" id="status" role="status" aria-live="polite"></p></form><p class="micro">New here? <a class="form-link" href="#create-account" id="createLink">Create an account</a></p><footer class="form-foot"><span class="tiny-lock">Protected sign-in UI demo</span><span>© Caged Dragon</span></footer></div></section></div></main></body></html>
