</span>

</div>
</div>
<!-- Password Field -->

<span class="material-symbols-outlined text-[19px]">lock</span>
</span>

<script>
  // Password Visibility Toggle Interaction
  const toggleBtn = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');

  if (toggleBtn && passwordInput && eyeIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }

  // Micro-interaction for Workspace Submission
  function triggerLaunchAnimation() {
    const btn = document.getElementById('launchButton');
    const btnText = document.getElementById('btnText');
    if (!btn || !btnText) return;

    btnText.innerHTML = `
      <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-current" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      Synthesizing Canvas...
    `;
    btn.classList.add('opacity-90', 'cursor-wait');

    setTimeout(() => {
      btnText.innerHTML = `
        <span class="material-symbols-outlined text-[18px]">check_circle</span>
        Canvas Ready
      `;
      btn.classList.remove('cursor-wait');
      btn.classList.add('from-tertiary', 'to-primary-container');
    }, 1500);
  }
</script></main></body></html>
